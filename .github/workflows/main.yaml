name: CI

# One group per PR (or branch), so a new push cancels the PR's older run.
# Pushes to main are never cancelled, so every main commit gets a full run.
# No `labeled` trigger: a label-only run would replace this commit's checks
# (golden tests live in goldens.yaml for that reason).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic_pull_request:
    name: Check PR Title
    if: github.event_name == 'pull_request'
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  flutter-check:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with .tool-versions and .fvmrc.
          flutter-version: 3.50.0
          cache: true

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3

      - name: 🎨 Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # `dart analyze --fatal-infos` in every package, so lints fail the PR.
      - name: 🧪 Run Analyze
        run: melos run analyze

      # Golden tests are excluded here: the goldens are macOS platform goldens
      # (see packages/liquid_glass_renderer/test/flutter_test_config.dart), so
      # they can't be compared on Linux. They run on macOS in goldens.yaml.
      - name: 📝 Run Tests without goldens
        run: melos run test-without-goldens
